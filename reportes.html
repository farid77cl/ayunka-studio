<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayünka · Reportes</title>
<style>
:root{--crema:#ECE6DA;--crema2:#F6F1E8;--carbon:#2F3A40;--coral:#CB5A52;--rosa:#E39B96;
--azul:#5F7C8E;--terra:#C27A4E;--ok:#3f7d5a;--linea:#dcd3c4}
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--carbon);
font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
header{text-align:center;margin-bottom:6px}
header h1{font-size:30px;margin:0;font-weight:700}
header h1 span{color:var(--coral)}
header .sub{letter-spacing:3px;text-transform:uppercase;color:var(--azul);font-size:12px}
.upd{text-align:center;font-size:12px;color:#8a8073;margin:6px 0 18px}
.tabs{display:flex;gap:10px;justify-content:center;margin:16px 0 22px;flex-wrap:wrap}
.tab{border:2px solid var(--azul);background:transparent;color:var(--azul);padding:9px 20px;
border-radius:30px;cursor:pointer;font-weight:600;font-family:inherit;font-size:14px}
.tab.active{background:var(--azul);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--crema2);border:1px solid var(--linea);border-radius:14px;padding:16px;text-align:center}
.kpi .n{font-size:30px;font-weight:700;color:var(--carbon)}
.kpi .l{font-size:12px;color:#8a8073;margin-top:2px}
.kpi.hi .n{color:var(--coral)}
h2{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:var(--azul);
margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--linea)}
.card{background:var(--crema2);border:1px solid var(--linea);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.txt{font-size:14px;line-height:1.5;flex:1}
.meta{font-size:12px;color:#8a8073;margin-top:4px}
.badge{background:#e6ded0;color:#6d6456;border-radius:11px;padding:3px 10px;font-size:11px;white-space:nowrap}
.badge.coral{background:#f6dedc;color:#8d3f39}
.badge.ok{background:#dcebe0;color:#2f6b48}
.stat{text-align:right;white-space:nowrap;font-size:13px}
.stat b{font-size:18px;display:block}
a{color:var(--azul)}
.empty{text-align:center;color:#8a8073;padding:36px;background:var(--crema2);border-radius:14px;border:1px dashed var(--linea)}
.hidden{display:none}
.pos{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;
background:var(--azul);color:#fff;font-size:13px;font-weight:700;margin-right:8px}
.pos.p1{background:var(--coral)}
.reload{display:block;margin:0 auto 18px;border:1px solid var(--linea);background:#fff;color:var(--carbon);
padding:8px 20px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ayünka <span>·</span> Reportes</h1>
    <div class="sub">Lo que n8n recopiló por ti</div>
  </header>
  <div class="upd" id="upd"></div>
  <button class="reload" onclick="cargar(true)">🔄 Actualizar</button>

  <div class="tabs">
    <button class="tab active" data-t="metricas">📊 Métricas</button>
    <button class="tab" data-t="consultas">💬 Consultas</button>
    <button class="tab" data-t="mensajes">✉️ Mensajes</button>
  </div>

  <section id="metricas"></section>
  <section id="consultas" class="hidden"></section>
  <section id="mensajes" class="hidden"></section>
</div>

<script>
const B='https://ncuvdpydwnepbysadoux.supabase.co/storage/v1/object/public/archivos/reportes/';
const F={metricas:B+'semanal-ultimo.json',consultas:B+'alertas-comentarios.json',mensajes:B+'mensajes-pendientes.json'};
let D={};

const fecha = s => s ? new Date(s).toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}) : '—';
const esc = s => (s||'').replace(/</g,'&lt;');

async function cargar(force){
  for (const k in F){
    try{ const r=await fetch(F[k]+'?v='+Date.now()); D[k]= r.ok ? await r.json() : null; }
    catch(e){ D[k]=null; }
  }
  pintar();
}

function pintar(){
  // --- Métricas ---
  const m=D.metricas, em=document.getElementById('metricas');
  if(!m){ em.innerHTML='<div class="empty">Todavía no hay reporte.<br><small>Se genera cada lunes a las 09:00.</small></div>'; }
  else{
    document.getElementById('upd').textContent='Última actualización: '+fecha(m.generado);
    em.innerHTML=`
      <div class="kpis">
        <div class="kpi"><div class="n">${m.publicaciones_semana??0}</div><div class="l">posts esta semana</div></div>
        <div class="kpi hi"><div class="n">${m.interacciones_semana??0}</div><div class="l">interacciones</div></div>
        <div class="kpi"><div class="n">${m.promedio_por_post??0}</div><div class="l">promedio por post</div></div>
        <div class="kpi"><div class="n" style="font-size:22px">${m.mejor_horario??'—'}</div><div class="l">mejor horario</div></div>
      </div>
      <h2>Los que mejor funcionaron</h2>
      ${(m.top_posts||[]).map((p,i)=>`
        <div class="card"><div class="row">
          <div class="txt">
            <span class="pos ${i===0?'p1':''}">${i+1}</span>${esc(p.texto)}
            <div class="meta">${p.fecha} · ${p.tipo} · <a href="${p.link}" target="_blank">ver post ↗</a></div>
          </div>
          <div class="stat"><b>${p.interacciones}</b>❤️ ${p.likes} · 💬 ${p.comentarios}</div>
        </div></div>`).join('') || '<div class="empty">Sin datos aún.</div>'}
      <h2>Resumen</h2>
      <div class="card"><div class="txt">
        Periodo: <b>${m.periodo||'—'}</b><br>
        Total de publicaciones en la cuenta: <b>${m.total_publicaciones??'—'}</b>
      </div></div>`;
  }

  // --- Consultas ---
  const c=D.consultas, ec=document.getElementById('consultas');
  if(!c){ ec.innerHTML='<div class="empty">Sin datos todavía.<br><small>Se revisa 3 veces al día.</small></div>'; }
  else{
    ec.innerHTML=`
      <div class="kpis">
        <div class="kpi hi"><div class="n">${c.total??0}</div><div class="l">consultas detectadas</div></div>
      </div>
      <h2>Comentarios que preguntan por productos</h2>
      ${(c.alertas||[]).map(a=>`
        <div class="card"><div class="row">
          <div class="txt">
            «${esc(a.comentario)}»
            <div class="meta">@${esc(a.usuario)} · ${a.fecha} · <a href="${a.post}" target="_blank">ver post ↗</a></div>
          </div>
          <span class="badge coral">${esc(a.palabra_clave)}</span>
        </div></div>`).join('') || '<div class="empty">Sin consultas nuevas 🎉</div>'}`;
  }

  // --- Mensajes ---
  const g=D.mensajes, eg=document.getElementById('mensajes');
  if(!g){ eg.innerHTML='<div class="empty">Sin datos todavía.<br><small>Se revisa cada 3 horas.</small></div>'; }
  else{
    eg.innerHTML=`
      <div class="kpis">
        <div class="kpi hi"><div class="n">${g.sin_responder??0}</div><div class="l">sin responder</div></div>
        <div class="kpi"><div class="n" style="font-size:20px">${g.horario_atencion||'—'}</div><div class="l">horario de atención</div></div>
      </div>
      <h2>Conversaciones pendientes</h2>
      ${(g.conversaciones||[]).map(v=>`
        <div class="card"><div class="row">
          <div class="txt">«${esc(v.ultimo_mensaje)}»
            <div class="meta">${esc(v.de)} · ${v.fecha}</div>
          </div>
          <span class="badge ${v.sin_leer?'coral':'ok'}">${v.sin_leer||0} sin leer</span>
        </div></div>`).join('') || '<div class="empty">Todo respondido 🎉</div>'}`;
  }
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  ['metricas','consultas','mensajes'].forEach(s=>
    document.getElementById(s).classList.toggle('hidden', s!==t.dataset.t));
});
cargar();
</script>
</body>
</html>
